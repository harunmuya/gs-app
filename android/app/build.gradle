apply plugin: 'com.android.application'

/*
  Release signing, read from a file that is never committed.

  Signing was done by hand in Android Studio, which meant the password was
  typed on every release and nothing in the project recorded which key was
  correct. A first V1 release establishes the key for every future update: once
  members have installed it, an APK signed with anything else can never update
  them, so getting this wrong is permanent.

  Create android/keystore.properties, which .gitignore already covers through
  the keystores directory rule extended below:

    storeFile=keystores/gsm-release.jks
    storePassword=...
    keyAlias=...
    keyPassword=...

  Without that file the release build is simply unsigned rather than broken, so
  a checkout with no secrets still builds.
*/
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ke.co.genuinesugarmummies.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        /*
          This is the V1 app, and it keeps its own identity.

          The APK that was sitting in public/downloads is com.genuinesugarmummies.global,
          labelled GS Global. That is the V2 app, built from the separate
          genuinesugarmummies.com project, which points at its own deployment.
          It was read here as though it were this app's published build, and
          applicationId was changed to match it. That was wrong: it would have
          shipped V1 under V2's identity and replaced V2 on every phone that had
          it.

          Two apps, two identities. This one is ke.co.genuinesugarmummies.app.
        */
        applicationId "ke.co.genuinesugarmummies.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
          versionCode must exceed whatever is installed, or Android refuses the
          install and offers uninstall as the only way forward, which loses
          local state. Bump it on every release and keep signing with the same
          keystore, since a changed signature is refused for the same reason.

          It sat at 1 and had never moved. Version 2 carries the WebView
          permission bridge and the download listener.

          Most changes need no release at all: the app loads the site from a
          remote URL, so the web layer updates itself on next launch. An APK is
          only needed when the manifest or MainActivity changes.
        */
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Unsigned rather than failing when the properties file is absent,
            // so a fresh checkout still builds.
            if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
