apply plugin: 'com.android.application'

android {
    namespace = "ke.co.genuinesugarmummies.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        /*
          This must match the app already on people's phones, or Android treats
          the new APK as a different application and installs it alongside the
          old one instead of updating it.

          The published APK is com.genuinesugarmummies.global. This said
          ke.co.genuinesugarmummies.app, so anything built here would have
          appeared as a second, empty copy of the app while the real one sat
          beside it untouched.

          namespace above is the Java package and is unrelated; only
          applicationId decides installed identity.
        */
        applicationId "com.genuinesugarmummies.global"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
          versionCode must exceed the version already installed, or Android
          refuses with "App not installed" and offers uninstall as the only way
          forward, which loses local state.

          The published APK is versionCode 3. This file said 1 until recently
          and then 2, so a build from it could never have updated anybody even
          once the package name was right.

          Bump on every release, and keep signing with the same keystore, since
          a changed signature is refused for the same reason. The published APK
          is signed CN=Genuine Sugar Mummies, OU=Mobile, SHA-256
          6b698972405d7e00856c368e0643ce964385f7ac96fba2ef27816ca2cdc538bc.

          Most changes need no release at all. The app loads the site from a
          remote URL, so the web layer updates itself on next launch. An APK is
          only needed when something native changes: the manifest, or
          MainActivity. Version 4 carries the WebView permission bridge.
        */
        versionCode 4
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
