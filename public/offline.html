<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>No connection - Genuine Sugar Mummies</title>
    <meta name="theme-color" content="#C21E56">
    <!--
      Last resort only. Reached when a navigation fails AND no cached copy of the
      page or app shell exists. Ordinary connection loss is handled inside the app
      by the ConnectionStatus banner, so a member on mobile data who drops signal
      for a moment keeps the interface they were using.
    -->
    <style>
        :root {
            --primary: #C21E56;
            --primary-dark: #8B1340;
            --ink: #14101A;
            --muted: #7D7488;
            --surface: #F3EEF0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% -5%, rgba(194, 30, 86, 0.05), transparent 45%),
                linear-gradient(180deg, #FBF9FA 0%, #FFFFFF 55%, #FCF4F7 100%);
        }
        main {
            width: min(100%, 400px);
            padding: 28px 24px;
            border: 1px solid rgba(20, 16, 26, 0.07);
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(155, 44, 94, 0.10), 0 2px 6px rgba(28, 16, 23, 0.05);
            text-align: center;
        }
        .mark {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            display: grid; place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.375rem; font-weight: 800;
            letter-spacing: -0.01em; line-height: 1.25;
        }
        p { margin: 0 0 20px; color: var(--muted); font-size: 0.9375rem; line-height: 1.55; }
        button {
            width: 100%; min-height: 48px;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            border: 0; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; font-size: 0.9375rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .hint {
            margin-top: 16px; padding-top: 16px;
            border-top: 1px solid rgba(20, 16, 26, 0.07);
            font-size: 0.8125rem; color: var(--muted); line-height: 1.5;
        }
        .status { margin-top: 12px; font-size: 0.8125rem; font-weight: 600; color: var(--primary); min-height: 1.2em; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.5 5.5a9 9 0 0 0 0 13"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                <circle cx="12" cy="12" r="2"/><path d="m3 3 18 18"/>
            </svg>
        </div>
        <h1>No connection</h1>
        <p>We can’t reach Genuine Sugar Mummies right now. Check your mobile data or Wi-Fi and try again.</p>
        <button type="button" id="retry">Try again</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="hint">
            On mobile data, make sure data is switched on and you have an active bundle.
            The app reconnects on its own as soon as a signal returns.
        </p>
    </main>

    <script>
        (function () {
            var button = document.getElementById('retry');
            var status = document.getElementById('status');

            function attempt() {
                status.textContent = 'Checking…';
                // Ask for something real rather than trusting navigator.onLine,
                // which stays true on mobile data with no working connection.
                fetch('/api/ping?t=' + Date.now(), { cache: 'no-store' })
                    .then(function () { location.reload(); })
                    .catch(function () { status.textContent = 'Still no connection.'; });
            }

            button.addEventListener('click', attempt);
            // Reload by itself the moment the device reports a connection again.
            window.addEventListener('online', attempt);
        })();
    </script>
</body>
</html>
