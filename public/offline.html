<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Genuine Sugarmummies</title>
    <link rel="icon" href="/gs-logo.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: #0F0F14;
            color: #F0F0F5;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 360px;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(232,99,74,0.15), rgba(255,138,107,0.15));
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .icon svg {
            width: 36px;
            height: 36px;
            color: #E8634A;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.875rem;
            color: #A0A0B0;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #E8634A, #FF8A6B);
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s;
        }
        .btn:active { transform: scale(0.97); }
        .tips {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border-radius: 1rem;
            text-align: left;
        }
        .tips h3 {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #F0F0F5;
        }
        .tips ul {
            list-style: none;
            font-size: 0.75rem;
            color: #A0A0B0;
        }
        .tips li {
            padding: 0.25rem 0;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .tips li::before {
            content: "•";
            color: #E8634A;
            font-weight: bold;
        }
        @media (prefers-color-scheme: light) {
            body { background: #FFFFFF; color: #1A1A2E; }
            p { color: #6B7280; }
            .tips { background: rgba(0,0,0,0.03); }
            .tips h3 { color: #1A1A2E; }
            .tips ul { color: #6B7280; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M8.464 15.536a5 5 0 010-7.072M15.536 8.464a5 5 0 010 7.072" />
                <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry — your matches and messages will be here when you reconnect.</p>
        <button class="btn" onclick="window.location.reload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Try Again
        </button>
        <div class="tips">
            <h3>While you wait:</h3>
            <ul>
                <li>Check your Wi-Fi or mobile data</li>
                <li>Move to an area with better signal</li>
                <li>Try turning airplane mode on and off</li>
            </ul>
        </div>
    </div>
</body>
</html>
