<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Genuine Sugar Mummies</title>
    <!--
      What the app shows for the moment before the site loads.

      This folder is the Capacitor webDir, and everything in it is copied into
      the APK. It used to point at public/, which is 71MB of seed photography,
      gift artwork and a stray copy of another project's APK, none of which the
      app can use: it loads the site from a remote URL and never reads a bundled
      file. The APK was 74MB for a shell that needs about three.

      So this is the whole bundled payload. It is only ever visible while the
      WebView is fetching the first page, and on a slow connection that is long
      enough to be worth not showing a white rectangle.
    -->
    <style>
        :root { color-scheme: light dark; }
        html, body {
            margin: 0;
            height: 100%;
            background: #14101A;
            color: #F7F4F9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .wrap {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            text-align: center;
        }
        img { width: 88px; height: 88px; border-radius: 22px; }
        p { margin: 0; font-size: 15px; opacity: 0.75; }
        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(247, 244, 249, 0.25);
            border-top-color: #E8477C;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Respect a system preference for less motion rather than spinning
           regardless; the message alone still says the app is working. */
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="icon.png" alt="" />
        <div class="spinner" role="status" aria-label="Loading"></div>
        <p>Connecting you to Genuine Sugar Mummies</p>
    </div>
</body>
</html>
